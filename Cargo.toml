[workspace]
resolver = "3"
members = ["crates/starex-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE"
authors = ["Starex contributors"]
repository = "https://github.com/setjet/starex"

[workspace.dependencies]
starex-core = { path = "crates/starex-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
blake3 = { version = "1.8", features = ["mmap", "rayon"] }
rayon = "1.11"
walkdir = "2.5"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
