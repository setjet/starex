name: PR title

# Pull requests are squash-merged, so the title becomes the commit message on main.
# It must follow Conventional Commits: release-please reads it to pick the next version.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            Start the subject with a lower-case letter and leave off the final full stop,
            e.g. "feat: show play time in the sidebar".
